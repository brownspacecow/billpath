name: Update legislative content

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Download legislative datasets
        run: echo "Download datasets"
      - name: Update bill statuses
        run: echo "Update statuses"
      - name: Generate timeline events
        run: echo "Generate timelines"
      - name: Generate bill movement records
        run: echo "Generate movements"
      - name: Recalculate path progress scores
        run: echo "Recalculate progress"
      - name: Generate daily briefing
        run: echo "Generate briefing"
      - name: Generate AI summaries
        run: echo "Generate AI summaries"
      - name: Build search index
        run: echo "Build search index"
      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data
          git diff --cached --quiet || git commit -m "chore: update legislative content"
      - name: Deploy GitHub Pages
        run: npm run build
